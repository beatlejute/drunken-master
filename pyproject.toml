[project]
name = "interpreter"
version = "0.1.0"
description = "MCP server that reconstructs what a user meant in a garbled mobile chat message, using TypeSafe Jev"
requires-python = ">=3.11"
dependencies = ["mcp>=2.0", "httpx>=0.27", "rapidfuzz>=3.0", "anthropic>=1.0", "pydantic>=2.0"]

[project.optional-dependencies]
dev = ["pytest"]

[project.scripts]
interpreter-mcp = "interpreter.server:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["interpreter*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
